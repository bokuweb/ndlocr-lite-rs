name: Frozen low-stop development evidence

on:
  pull_request:
    paths:
      - '.github/workflows/low-stop-evidence.yml'
      - 'tools/verify_low_stop_evidence.py'
      - 'tools/verify_additional_real_baseline.py'
      - 'tools/verify_additional_real_primary_trace.py'
      - 'tools/additional_real_primary_trace.py'
      - 'docs/benchmarks/real-vertical-additional-primary-trace/**'
      - 'tools/verify_cli_cascade_trace.py'
      - 'tools/verify_vertical_cli_model_agreement.py'
      - 'tools/verify_vertical_cli_fallback.py'
      - 'tools/verify_vertical_cli_fallback_v2.py'
      - 'tests/test_vertical_cli_fallback_v2_packet.py'
      - 'tests/test_vertical_cli_fallback_v2_options.py'
      - 'tools/vertical_cli_fallback_v2_options.py'
      - 'tools/vertical_cli_fallback_v2_full_scope.py'
      - 'tests/test_vertical_cli_fallback_v2_full_scope.py'
      - 'docs/benchmarks/vertical-cli-fallback-v2/**'
      - 'tests/test_vertical_cli_fallback_packet.py'
      - 'docs/benchmarks/vertical-cli-fallback/new72-cli-matrix-v1.*'
      - 'tests/test_vertical_cli_model_agreement_packet.py'
      - 'docs/benchmarks/vertical-cli-model-agreement/**'
      - 'tests/test_cli_cascade_trace_packet.py'
      - 'docs/benchmarks/vertical-cli-cascade-trace/**'
      - 'tools/additional_real_diagnostic.py'
      - 'tests/test_additional_real_*.py'
      - 'docs/benchmarks/real-vertical-additional-controls/**'
      - 'tools/low_stop_evidence_requirements.txt'
      - 'tests/test_vertical_low_stop_evidence.py'
      - 'tools/vertical_page_model_choice.py'
      - 'tests/test_vertical_page_model_choice.py'
      - 'tests/test_vertical_completed_page_evidence.py'
      - 'tools/vertical_page_matrix.py'
      - 'tools/vertical_page_shards.py'
      - 'docs/benchmarks/vertical-page-fallback/completed-pages-linux-v1*'
      - 'docs/benchmarks/vertical-page-fallback/verify_completed_pages.py'
      - 'docs/benchmarks/vertical-page-fallback/bundle.json'
      - 'docs/benchmarks/vertical-page-fallback/data.zip'
      - 'docs/benchmarks/vertical-page-fallback/sources.zip'
      - 'docs/benchmarks/vertical-low-stop-development/**'
      - 'docs/benchmarks/vertical-partition-agreement/fast_distance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/low_stop_evidence_requirements.txt
      - name: Integrity, completeness, normalization and glyph boundary regressions
        run: python -m unittest discover -s tests -p test_vertical_low_stop_evidence.py -v
      - name: Saved Page model-choice classification regressions
        run: python -m unittest discover -s tests -p test_vertical_page_model_choice.py -v
      - name: Replay complete Page kinds and every saved metric without models
        run: python -m unittest discover -s tests -p test_vertical_completed_page_evidence.py -v
      - name: Frozen real controls, primary trace pixels and saved metrics
        run: |
          python -m unittest discover -s tests -p 'test_additional_real_*.py' -v
          python tools/verify_additional_real_baseline.py
      - name: Replay known CLI stage trace without recognition
        run: python -m unittest discover -s tests -p test_cli_cascade_trace_packet.py -v
      - name: Authenticate isolated C1 source and new controls without models
        run: python -m unittest discover -s tests -p test_vertical_cli_model_agreement_packet.py -v
      - name: Replay all FVC new72 CLI results without models
        run: python -m unittest discover -s tests -p test_vertical_cli_fallback_packet.py -v
      - name: Authenticate isolated FVC v2 sources and fresh controls without models
        run: |
          python -m unittest discover -s tests -p test_vertical_cli_fallback_v2_packet.py -v
          python -m unittest discover -s tests -p test_vertical_cli_fallback_v2_options.py -v
          python -m unittest discover -s tests -p test_vertical_cli_fallback_v2_full_scope.py -v
      - name: Verify saved metrics and reconstruct captured RGB hashes without NN
        run: python tools/verify_low_stop_evidence.py
