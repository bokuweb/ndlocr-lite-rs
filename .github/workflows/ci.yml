name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --no-deps

      - name: cargo test
        run: cargo test

      - name: Asset fetcher regressions
        run: python3 -m unittest discover -s tests -p test_fetch_upstream_assets.py

  inference:
    name: real PARSeq (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: onnx
      - name: Fetch and verify pinned official assets
        run: |
          python3 tools/fetch_upstream_assets.py models
          python3 tools/fetch_upstream_assets.py models --offline
      - name: Real raw and reusable-session regressions
        env:
          NDLOCR_TEST_PARSEQ_MODEL: models/parseq-ndl-24x256-30-tiny-189epoch-tegaki3-r8data-202604.onnx
          NDLOCR_TEST_CHARSET: models/NDLmoji.yaml
          NDLOCR_TEST_REPEAT_IMAGE: tests/fixtures/parseq_unprocessed/repeated_digits.png
        run: cargo test --features onnx --lib --test parseq_unprocessed_tests --test parseq_session_unprocessed_tests --test chromatic_panels_tests --test chromatic_panel_edges_tests --test chromatic_text_contrast_tests --test short_line_tests --test model_context_chunks_tests --test isolated_short_line_tests --test sparse_edge_glyph_tests --test narrow_bearings_tests --test fragmented_glyph_tests --test truncated_glyph_tests --test small_kana_bearing_tests --test internal_glyph_gap_tests --test word_tail_context_tests --test tall_kana_bearing_tests --test open_glyph_bearing_tests --test isolated_latin_tests --test punctuation_bearings_tests --test latin_punctuation_spaces_tests --test white_margin_crop_tests --test word_boundary_crop_tests --test chunk_margins_tests --test chunk_word_omission_tests --test residual_spaces_tests --test proportional_word_spaces_tests --test residual_model_context_tests --test font_emulation_context_tests -- --include-ignored
