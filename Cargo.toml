[package]
name = "ndlocr-lite-rs"
version = "0.1.0"
edition = "2024"
license = "CC-BY-4.0"
repository = "https://github.com/bokuweb/ndlocr-lite-rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# ONNX Runtime 推論を有効化。`ort` 2.x (download-binaries で自前バイナリ取得) を使う。
onnx = ["inference", "dep:ort", "dep:ndarray"]
# 推論パイプライン本体（`infer::backend` 経由）。単独では既定のバックエンドを持たない。
inference = []
web = ["inference", "dep:wasm-bindgen", "dep:js-sys"]
# CoreML EP (現状未サポート: parseq の dynamic batch / DEIM の op の都合で
# `Failed to build the model execution plan` か MatMul shape mismatch で
# ロード or 推論失敗するため、有効化しても動かない。フォローアップ用の placeholder。
# 詳細は src/infer/ort_init.rs のコメント参照)。
coreml = ["onnx", "ort/coreml"]

[dependencies]
unicode-width = { version = "=0.2.2", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25.9"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "api-24",
] }
ndarray = { version = "0.17", optional = true }
once_cell = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"

[[example]]
name = "probe_margin_sensitivity"
required-features = ["onnx"]

[[example]]
name = "compare_parseq_resampling"
required-features = ["onnx"]

[[example]]
name = "compare_parseq_opencv"
required-features = ["onnx"]

[[bench]]
name = "line_segment_bench"
harness = false

[[bench]]
name = "parseq_decode_bench"
harness = false

[[bench]]
name = "parseq_preprocess_bench"
harness = false

[[bench]]
name = "parseq_batch_preprocess_bench"
harness = false

[[bench]]
name = "deim_preprocess_bench"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.121", optional = true }
js-sys = { version = "0.3", optional = true }
